server:
  port: 8080

spring:
  application:
    name: meeting-room-api
  datasource:
    url: jdbc:h2:file:./data/meetingroom;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    jwt:
      secret: meeting-room-jwt-secret-key-change-me-32chars-min
      expiration-ms: 86400000
    demo-user:
      username: admin
      password: admin123

logging:
  level:
    org.springframework.security: INFO
